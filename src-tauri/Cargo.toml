[package]
name = "basak-odeme-cari"
version = "0.1.0"
description = "Basak Kir Pidesi Odeme & Cari Takip - masaustu uygulamasi"
authors = ["PUNCH YAZILIM"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Kütüphane adı sabit (main.rs `app_lib::run()` çağırır; mobil hedefler de kullanır)
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
