# ---------------------------------------------------------------------------
# Web sürümünü GitHub Pages'e yayınlar (telefon/tarayıcıdan açılabilen public link).
# Tetikleme: Actions sekmesinden elle (workflow_dispatch).
# Derleme feature branch kodu uzerinden, /Basak_PunchH/ alt-yoluyla yapilir.
# Firebase VITE_* degerleri repo secrets'tan okunur.
# ---------------------------------------------------------------------------
name: Web Önizleme (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/phase-1-web-core-gFaw9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Derle (Pages alt-yolu)
        run: npm run build -- --base=/Basak_PunchH/
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: SPA fallback (404 -> index)
        run: cp dist/index.html dist/404.html

      - name: Pages yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages artifact yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
