# ---------------------------------------------------------------------------
# Masaüstü kurulum paketlerini (Windows .exe/.msi, macOS .dmg, Linux AppImage/deb)
# derleyip GitHub Releases altında İNDİRİLEBİLİR olarak yayınlar.
#
# Tetikleme:
#   - "v" ile başlayan bir etiket (tag) gönderildiğinde   (ör. v0.1.0)
#   - veya Actions sekmesinden elle (workflow_dispatch)
#
# Sonuç: Repo > Releases sayfasında her platform için indirme linkleri.
#
# NOT (Firebase): Vite, derleme anında VITE_FIREBASE_* değişkenlerini gömer.
# .env repoya girmediği için bu değerler GitHub > Settings > Secrets and
# variables > Actions altında "Repository secrets" olarak eklenmelidir:
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# (Firebase web yapılandırması gizli değildir; istemciye zaten gömülür.)
# ---------------------------------------------------------------------------
name: Masaüstü Sürüm (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  derle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # Windows .exe (NSIS) + .msi
          - platform: macos-latest # macOS .dmg
          - platform: ubuntu-24.04 # Linux AppImage + .deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/phase-1-web-core-gFaw9

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Rust önbellek
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux bağımlılıkları
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Tauri derle + Release'e yükle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        with:
          tagName: v0.1.0
          releaseName: 'Başak Ödeme & Cari Takip v0.1.0'
          releaseBody: 'Otomatik üretilen kurulum paketleri. Windows için .exe/.msi dosyasını indirin.'
          releaseDraft: true
          prerelease: false
